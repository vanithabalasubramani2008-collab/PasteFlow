version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pasteflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pasteflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pasteflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pasteflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pasteflow_user} -d ${POSTGRES_DB:-pasteflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pasteflow_backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pasteflow_user:pasteflow_pass@postgres:5432/pasteflow_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_refresh_key}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - GOOGLE_CLIENT_ID=424115617950-m72lpmu5fcqq8h21hhkcprlh56a6fkhk.apps.googleusercontent.com
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pasteflow_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: pasteflow_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
