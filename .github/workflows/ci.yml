name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pasteflow_user
          POSTGRES_PASSWORD: pasteflow_pass
          POSTGRES_DB: pasteflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    # Backend tests
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
    - name: Run backend tests
      env:
        DATABASE_URL: postgresql://pasteflow_user:pasteflow_pass@localhost:5432/pasteflow_db
      run: |
        cd backend
        python -m pytest tests/

    # Frontend tests
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install frontend dependencies
      run: |
        cd frontend
        if [ -f package.json ]; then npm install; fi
    - name: Run frontend tests
      run: |
        cd frontend
        if [ -f package.json ]; then npm run test --if-present; fi

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build backend image
      run: docker build -t pasteflow-backend ./backend
      
    - name: Build frontend image
      run: docker build -t pasteflow-frontend ./frontend
